[project]
name = "fastapi-guide-for-me"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.2.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
exclude = [
    "lessons",
]

[tool.mypy]
exclude = [
    "^lessons/",
]

[tool.pytest.ini_options]
norecursedirs = [
    "lessons",
]
